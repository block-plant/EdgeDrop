name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-macos:
    name: Build macOS DMG (Universal / Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install qt@6 opencv qpdf nlohmann-json create-dmg
          brew link --force qt@6

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEDGEDROP_BUILD_TESTS=ON \
            -DEDGEDROP_BUILD_DESKTOP=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix opencv);$(brew --prefix qpdf)"

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run Test Suite (10/10 CTests)
        run: ctest --test-dir build --output-on-failure

      - name: Package DMG
        run: |
          chmod +x packaging/macos/create_dmg.sh
          ./packaging/macos/create_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgedrop-macos
          path: dist/EdgeDrop-macOS-*.dmg

  build-windows:
    name: Build Windows Installer (NSIS x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt & Dependencies
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@v1

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'packaging/windows/triplets/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DEDGEDROP_BUILD_TESTS=ON `
            -DEDGEDROP_BUILD_DESKTOP=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/packaging/windows/triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run Tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package NSIS Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exePath = "build/Release/EdgeDrop.exe"
          if (-not (Test-Path $exePath)) { $exePath = "build/Release/edgedrop.exe" }
          windeployqt --qmldir desktop/qml --release $exePath
          if (Test-Path "build/vcpkg_installed/x64-windows-release/bin") {
            Copy-Item "build/vcpkg_installed/x64-windows-release/bin/*.dll" "build/Release/" -Force
          }
          if (Test-Path "build/vcpkg_installed/x64-windows/bin") {
            Copy-Item "build/vcpkg_installed/x64-windows/bin/*.dll" "build/Release/" -Force
          }
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release/bin") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release/bin/*.dll" "build/Release/" -Force
          }
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "build/Release/" -Force
          }
          if ((Test-Path "build/Release/edgedrop.exe") -and -not (Test-Path "build/Release/EdgeDrop.exe")) {
            Copy-Item "build/Release/edgedrop.exe" "build/Release/EdgeDrop.exe"
          }
          makensis packaging/windows/installer.nsi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgedrop-windows
          path: dist/EdgeDrop-Windows-x64-Setup.exe

  build-linux:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev \
            libopencv-dev libqpdf-dev nlohmann-json3-dev zlib1g-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtquick-effects \
            qml6-module-qtquick-dialogs

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEDGEDROP_BUILD_TESTS=ON \
            -DEDGEDROP_BUILD_DESKTOP=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          chmod +x packaging/linux/create_appimage.sh
          ./packaging/linux/create_appimage.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgedrop-linux
          path: dist/EdgeDrop-Linux-*.AppImage

  create-release:
    name: Generate Checksums & Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release binaries & generate SHA256SUMS
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          body: |
            ## EdgeDrop v5.0.0 Release

            EdgeDrop is a local-first, zero-trust offline file compression tool for macOS, Windows, and Linux.

            ### Downloads & Verification
            Verify downloads against `SHA256SUMS` attached below.

            ### A quick note before you open EdgeDrop
            EdgeDrop is built by an independent creator and currently distributed as an unsigned, open-source binary. Because it isn’t signed with a paid Apple Developer or Microsoft certificate ($99–$499/yr), your operating system will show a standard first-launch warning:

            - **macOS:** You may see *“EdgeDrop cannot be opened because Apple cannot check it for malicious software”* or *“unidentified developer.”*
              → Right-click (or Control-click) `EdgeDrop.app`, choose **Open**, and click **Open** again.
              → Or run in Terminal: `xattr -cr /Applications/EdgeDrop.app`

            - **Windows:** SmartScreen may display *“Windows protected your PC.”*
              → Click **“More info”** and then select **“Run anyway.”**

            - **Linux:** Ensure execution permission is set:
              → `chmod +x EdgeDrop-*.AppImage`

            Every release is 100% open-source, reproducible, built on transparent GitHub Actions runners, and SHA-256 checksummed below. EdgeDrop makes zero network calls and runs entirely offline on your device.
