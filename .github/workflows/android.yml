name: Android CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64 & x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK & NDK Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK & Bundled Native Libraries
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "::error::No APK found in android/app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at: ${APK_PATH}"
          echo "Verifying classes.dex and 64-bit native libraries..."
          unzip -l "${APK_PATH}" | grep "classes.dex"
          unzip -l "${APK_PATH}" | grep "lib/arm64-v8a/libedgedrop_jni.so"
          unzip -l "${APK_PATH}" | grep "lib/x86_64/libedgedrop_jni.so"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgedrop-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload to GitHub Release (on tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/*.apk
